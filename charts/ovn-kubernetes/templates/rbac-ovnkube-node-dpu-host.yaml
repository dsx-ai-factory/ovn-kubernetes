{{- $tags := (.Values.tags | default dict) }}
{{- if or (index $tags "ovnkube-node-dpu-host") (index $tags "ovnkube-single-node-zone-dpu") }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ovn-node-dpu-host
  namespace: {{ .Values.global.namespace }}
{{- if .Values.global.imagePullSecretName }}
imagePullSecrets:
  - name: {{ .Values.global.imagePullSecretName }}
{{- end }}
automountServiceAccountToken: false
{{- end }}

{{- if (index $tags "ovnkube-node-dpu-host") }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ovn-node-dpu-host
roleRef:
  name: ovn-node-dpu-host
  kind: ClusterRole
  apiGroup: rbac.authorization.k8s.io
subjects:
  {{- if .Values.global.enableOvnKubeIdentity }}
  - kind: Group
    name: system:ovn-nodes
    apiGroup: rbac.authorization.k8s.io
  {{- else }}
  - kind: ServiceAccount
    namespace: {{ .Values.global.namespace }}
    name: ovn-node-dpu-host
  {{- end }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  namespace: {{ .Values.global.namespace }}
  name: ovn-node-dpu-host-specific-rolebindings
roleRef:
  name: ovn-node-dpu-host-specific-roles
  kind: Role
  apiGroup: rbac.authorization.k8s.io
subjects:
  - kind: ServiceAccount
    namespace: {{ .Values.global.namespace }}
    name: ovn-node-dpu-host

---
# RBAC policies for ovnk8s-node-dpu-host
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ovn-node-dpu-host
rules:
  - apiGroups:
      - ""
    resources:
      - pods
    verbs: ["get", "list", "watch", "update"]
  - apiGroups:
      - ""
    resources:
      - nodes
      - services
      - namespaces
      # moved from only-ovnk8s-configmaps RoleBindings
      - configmaps
    verbs: ["get", "list", "watch"]
  - apiGroups:
      - discovery.k8s.io
    resources:
      - endpointslices
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch", "update"]
  - apiGroups:
      - k8s.ovn.org
    resources:
      - egressips
    verbs: ["get", "list", "watch"]
{{- if eq (default false .Values.global.enableEgressService) true }}
  - apiGroups: ["k8s.ovn.org"]
    resources:
      - egressservices
    verbs: ["get", "list", "watch"]
{{- end }}
{{- if eq (default false .Values.global.enableMultiExternalGateway) true }}
  - apiGroups: ["k8s.ovn.org"]
    resources:
      - adminpolicybasedexternalroutes
    verbs: ["get", "list", "watch"]
{{- end }}
{{- if or .Values.global.enableRouteAdvertisements .Values.global.enableNoOverlayManagedRouting }}
  - apiGroups: ["k8s.ovn.org"]
    resources:
      - routeadvertisements
    verbs: ["get", "list", "watch"]
{{- end }}
  - apiGroups: [""]
    resources:
      - nodes/status
      - pods/status
    verbs: [ "patch", "update" ]
  - apiGroups:
      - k8s.cni.cncf.io
    resources:
      - network-attachment-definitions
    verbs: ["get", "list", "watch"]
{{- if .Values.global.enableNetworkSegmentation }}
  - apiGroups: ["k8s.ovn.org"]
    resources:
      - userdefinednetworks
      - clusteruserdefinednetworks
    verbs: ["get", "list", "watch"]
{{- end }}
  - apiGroups: ["k8s.ovn.org"]
    resources:
      - uplinks
      - uplinkstates
    verbs: ["get", "list", "watch"]
  - apiGroups: ["k8s.ovn.org"]
    resources:
      - uplinkstates
    verbs: ["create", "delete", "patch", "update"]
{{- if (hasKey .Values.global "enableAdminPbr" | ternary .Values.global.enableAdminPbr true) }}
  - apiGroups: ["k8s.ovn.org"]
    resources:
      - adminpolicybasedroutes
    verbs: ["get", "list", "watch"]
  - apiGroups: ["k8s.ovn.org"]
    resources:
      - adminpolicybasedroutes/status
    verbs: ["patch", "update"]
{{- end }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: {{ .Values.global.namespace }}
  name: ovn-node-dpu-host-specific-roles
rules:
  # moved from only-ovnk8s-configmaps RoleBinding
  - apiGroups: [""]
    resources:
      - configmaps
      - secrets
    verbs: ["get", "list", "watch"]
  # moved from only-ovnk8s-endpoints RoleBinding
  - apiGroups: [""]
    resources:
      - endpoints
    verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
    name: ovnkube-node-dpu-host-leases
    namespace: {{ .Values.global.namespace }}
roleRef:
    name: ovnkube-node-dpu-leases
    kind: Role
    apiGroup: rbac.authorization.k8s.io
subjects:
    {{- if eq (hasKey .Values.global "enableOvnKubeIdentity" | ternary .Values.global.enableOvnKubeIdentity true) true }}
    - kind: Group
      name: system:ovn-nodes
      apiGroup: rbac.authorization.k8s.io
    {{- else }}
    - kind: ServiceAccount
      name: ovn-node-dpu-host
      namespace: {{ .Values.global.namespace }}
    {{- end }}
{{- end }}
