---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ovs-node
  namespace: {{ .Values.global.namespace }}
  annotations:
    kubernetes.io/description: |
      This DaemonSet launches the ovs networking components for all nodes.
spec:
  selector:
    matchLabels:
      app: ovs-node
  updateStrategy:
    type: {{ default "RollingUpdate" .Values.updateStrategy }}
  template:
    metadata:
      labels:
        app: ovs-node
        name: ovs-node
        component: network
        type: infra
        kubernetes.io/os: "linux"
    spec:
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.global.imagePullSecretName }}
      imagePullSecrets:
        - name: {{ .Values.global.imagePullSecretName }}
      {{- end }}
      serviceAccountName: ovn-ovs
      priorityClassName: system-cluster-critical
      hostNetwork: true
      dnsPolicy: Default
      {{- if not .Values.global.unprivilegedMode }}
      hostPID: true
      {{- end }}
      containers:
        - name: ovs-daemons
          image: {{ include "ovn-kubernetes.generateContainerImageString" (dict "image" .Values.ovsDaemonsContainer.image "Values" $.Values) }}
          imagePullPolicy: IfNotPresent
          command: ["/root/ovnkube.sh", "ovs-server"]
          livenessProbe:
            exec:
              command: ["/usr/share/openvswitch/scripts/ovs-ctl", "status"]
            initialDelaySeconds: 30
            timeoutSeconds: 30
            periodSeconds: 60
          readinessProbe:
            exec:
              command: ["/usr/bin/ovn-kube-util", "readiness-probe", "-t", "ovs-daemons"]
            initialDelaySeconds: 30
            timeoutSeconds: 30
            periodSeconds: 60
          securityContext:
            runAsUser: 0
            privileged: true
          terminationMessagePolicy: FallbackToLogsOnError
          resources:
            requests:
              cpu: 100m
              memory: 300Mi
          volumeMounts:
            - name: host-modules
              mountPath: /lib/modules
              readOnly: true
            - name: host-var-run-ovs
              mountPath: /var/run/openvswitch
            - name: host-sys
              mountPath: /sys
            - name: host-etc-openvswitch
              mountPath: /etc/openvswitch
            - name: host-var-run-dbus
              mountPath: /var/run/dbus
            - name: host-var-log-ovs
              mountPath: /var/log/openvswitch
            - name: host-var-lib-ovs
              mountPath: /var/lib/openvswitch
          env:
            - name: OVN_DAEMONSET_VERSION
              value: "1.4.0"
          lifecycle:
            preStop:
              exec:
                command: ["/root/ovnkube.sh", "cleanup-ovs-server"]
      nodeSelector:
        kubernetes.io/os: "linux"
      volumes:
        - name: host-modules
          hostPath:
            path: /lib/modules
        - name: host-var-run-dbus
          hostPath:
            path: /var/run/dbus
        - name: host-var-log-ovs
          hostPath:
            path: /var/log/openvswitch
        - name: host-var-run-ovs
          hostPath:
            path: /var/run/openvswitch
        - name: host-sys
          hostPath:
            path: /sys
        - name: host-etc-openvswitch
          hostPath:
            path: /etc/openvswitch
        - name: host-var-lib-ovs
          hostPath:
            path: /var/lib/openvswitch
      tolerations:
        - operator: Exists
