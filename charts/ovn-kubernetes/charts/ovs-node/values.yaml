# Default values for ovs-node
# Container image details in the parent chart's values.yaml.
# do not schedule on hosts with dpu
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
      - matchExpressions:
        - key: k8s.ovn.org/dpu-host
          operator: DoesNotExist
