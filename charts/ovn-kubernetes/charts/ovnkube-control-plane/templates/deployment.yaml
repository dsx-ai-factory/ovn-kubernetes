{{- /* PDB with minAvailable: 1 blocks rolling updates when replicas == 1 */ -}}
{{- if gt (int (default 1 .Values.replicas)) 1 }}
# ovnkube-control-plane-pdb PodDisruptionBudget ensures that the number of replicas running is never brought
# below the number needed for HA.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  namespace: {{ .Values.global.namespace }}
  name: ovnkube-control-plane-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      name: ovnkube-control-plane
---
{{- end }}
# ovnkube-control-plane
# daemonset version 3
# starts ovnkube-cluster-manager
# it is run on the control-plane node(s).
kind: Deployment
apiVersion: apps/v1
metadata:
  name: ovnkube-control-plane
  # namespace set up by install
  namespace: {{ .Values.global.namespace }}
  annotations:
    kubernetes.io/description: |
      This Deployment launches the ovn-kubernetes cluster manager networking component.
spec:
  progressDeadlineSeconds: 600
  replicas: {{ default 1 .Values.replicas }}
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      name: ovnkube-control-plane
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        name: ovnkube-control-plane
        component: network
        type: infra
        kubernetes.io/os: "linux"
      {{- if .Values.forceRestartManagerReason }}
      annotations:
        nais.nvidia.com/managerRestartedFor: {{ .Values.forceRestartManagerReason | quote }}
      {{- end }}
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      priorityClassName: "system-cluster-critical"
      # Requires fairly broad permissions - ability to read all services and network functions as well
      # as all pods.
      serviceAccountName: ovnkube-cluster-manager
      automountServiceAccountToken: true
      hostNetwork: true
      dnsPolicy: Default
      {{- if .Values.affinity }}
      affinity: {{ toYaml .Values.affinity | nindent 8 }}
      {{- end }}
      containers:
      - name: ovnkube-cluster-manager
        image: {{ include "ovn-kubernetes.generateContainerImageString" (dict "image" .Values.ovnkubeControlPlane.image "Values" $.Values) }}
        imagePullPolicy: "IfNotPresent"
        command: ["/root/ovnkube.sh", "ovn-cluster-manager"]
        securityContext:
          runAsUser: 0
        terminationMessagePolicy: FallbackToLogsOnError
        volumeMounts:
        - mountPath: /var/log/ovn-kubernetes/
          name: host-var-log-ovnkube
        - mountPath: /var/run/openvswitch/
          name: host-var-run-ovs
        - mountPath: /var/run/ovn/
          name: host-var-run-ovs
        - mountPath: /run/ovnkube-config
          name: ovnkube-config
          readOnly: true
        resources:
          requests:
            cpu: 100m
            memory: 300Mi
        env:
        {{- if .Values.global.enableCoredumps }}
        - name: GOTRACEBACK
          value: "crash"
        {{- end }}
        - name: OVN_DAEMONSET_VERSION
          value: "1.4.0"
        - name: OVNKUBE_LOGLEVEL
          value: {{ .Values.ovnkubeControlPlane.logging.level | quote }}
        - name: OVNKUBE_LOGFILE_MAXSIZE
          value: "100"
        - name: OVNKUBE_LOGFILE_MAXBACKUPS
          value: "20"
        - name: OVNKUBE_LOGFILE_MAXAGE
          value: "20"
        - name: OVNKUBE_CONFIG_DURATION_ENABLE
          value: "false"
        - name: OVNKUBE_METRICS_SCALE_ENABLE
          value: "false"
        {{- if and .Values.global.metricsClusterManagerPprofPort (ne (toString .Values.global.metricsClusterManagerPprofPort) "0") }}
        - name: OVN_METRICS_CLUSTER_MANAGER_PPROF_PORT
          value: {{ .Values.global.metricsClusterManagerPprofPort | quote }}
        {{- end }}
        - name: OVN_NET_CIDR
          valueFrom:
            configMapKeyRef:
              name: ovn-config
              key: net_cidr
        - name: OVN_SVC_CIDR
          valueFrom:
            configMapKeyRef:
              name: ovn-config
              key: svc_cidr
        - name: K8S_APISERVER
          valueFrom:
            configMapKeyRef:
              name: ovn-config
              key: k8s_apiserver
        - name: OVN_MTU
          valueFrom:
            configMapKeyRef:
              name: ovn-config
              key: mtu
        - name: K8S_NODE
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: K8S_NODE_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        {{- if .Values.global.metricsIp }}
        - name: METRICS_IP
          value: {{ .Values.global.metricsIp | quote }}
        {{- end }}
        - name: OVN_KUBERNETES_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: OVN_HYBRID_OVERLAY_ENABLE
          value: {{ hasKey .Values.global "enableHybridOverlay" | ternary .Values.global.enableHybridOverlay false | quote }}
        - name: OVN_HYBRID_OVERLAY_NET_CIDR
          value: ""
        - name: OVN_ADMIN_NETWORK_POLICY_ENABLE
          value: {{ hasKey .Values.global "enableAdminNetworkPolicy" | ternary .Values.global.enableAdminNetworkPolicy false | quote }}
        - name: OVN_EGRESSIP_ENABLE
          value: {{ hasKey .Values.global "enableEgressIp" | ternary .Values.global.enableEgressIp false | quote }}
        - name: OVN_EGRESSIP_HEALTHCHECK_PORT
          value: {{ default "0" .Values.global.egressIpHealthCheckPort | quote }}
        - name: OVN_EGRESSIP_REACHABILITY_TIMEOUT
          value: ""

        - name: OVN_EGRESSSERVICE_ENABLE
          value: {{ hasKey .Values.global "enableEgressService" | ternary .Values.global.enableEgressService false | quote }}
        - name: OVN_EGRESSFIREWALL_ENABLE
          value: {{ hasKey .Values.global "enableEgressFirewall" | ternary .Values.global.enableEgressFirewall true | quote }}
        - name: OVN_EGRESSQOS_ENABLE
          value: {{ hasKey .Values.global "enableEgressQos" | ternary .Values.global.enableEgressQos false | quote }}
        - name: OVN_MULTI_NETWORK_ENABLE
          value: "true"
        - name: OVN_DISABLE_SNAT_MULTIPLE_GWS
          value: ""
        - name: OVN_EMPTY_LB_EVENTS
          value: {{ hasKey .Values.global "emptyLbEvents" | ternary .Values.global.emptyLbEvents false | quote }}
        - name: OVN_V4_JOIN_SUBNET
          value: {{ default "" .Values.global.v4JoinSubnet | quote }}
        - name: OVN_V6_JOIN_SUBNET
          value: ""
        - name: OVN_SSL_ENABLE
          value: "no"
        - name: OVN_GATEWAY_MODE
          value: "shared"
        - name: OVN_MULTICAST_ENABLE
          value: {{ hasKey .Values.global "enableMulticast" | ternary .Values.global.enableMulticast false | quote }}
        - name: OVN_HOST_NETWORK_NAMESPACE
          valueFrom:
            configMapKeyRef:
              name: ovn-config
              key: host_network_namespace
        - name: OVN_NETWORK_SEGMENTATION_ENABLE
          value: {{ hasKey .Values.global "enableNetworkSegmentation" | ternary .Values.global.enableNetworkSegmentation false | quote }}
        - name: OVN_NETWORK_CONNECT_ENABLE
          value: {{ default "false" .Values.global.enableNetworkConnect | quote }}
        - name: OVN_ROUTE_ADVERTISEMENTS_ENABLE
          value: {{ default "false" .Values.global.enableRouteAdvertisements | quote }}
        - name: OVN_UPLINK_ENABLE
          value: {{ default "false" .Values.global.enableUplink | quote }}
        - name: OVN_EVPN_ENABLE
          value: {{ default "false" .Values.global.enableEVPN | quote }}
        - name: OVN_ADVERTISED_UDN_ISOLATION_MODE
          value: {{ default "strict" .Values.global.advertisedUDNIsolationMode | quote }}
        - name: OVNKUBE_CLUSTER_DEFAULT_NAD
          value: {{ include "ovn-kubernetes.getClusterDefaultNad" . | quote }}
        - name: OVN_NO_OVERLAY_ENABLE
          value: {{ default "false" .Values.global.enableNoOverlay | quote }}
        - name: OVN_ENABLE_MULTI_EXTERNAL_GATEWAY
          value: {{ hasKey .Values.global "enableMultiExternalGateway" | ternary .Values.global.enableMultiExternalGateway false | quote }}
        - name: OVN_NETWORK_QOS_ENABLE
          value: {{ default "false" .Values.global.enableNetworkQos | quote }}
        - name: OVN_PRE_CONF_UDN_ADDR_ENABLE
          value: {{ default "false" .Values.global.enablePreconfiguredUDNAddresses | quote }}
        - name: OVN_DYNAMIC_UDN_ALLOCATION
          value: {{ default "false" .Values.global.enableDynamicUDNAllocation | quote }}
        - name: OVN_DYNAMIC_UDN_GRACE_PERIOD
          value: {{ default "" .Values.global.dynamicUDNGracePeriod | quote }}
        - name: OVN_V4_TRANSIT_SUBNET
          value: {{ default "" .Values.global.v4TransitSubnet | quote }}
        - name: OVN_V6_TRANSIT_SUBNET
          value: ""
        - name: OVN_ENABLE_PERSISTENT_IPS
          value: {{ hasKey .Values.global "enablePersistentIPs" | ternary .Values.global.enablePersistentIPs false | quote }}
        - name: OVN_ENABLE_DNSNAMERESOLVER
          value: {{ hasKey .Values.global "enableDNSNameResolver" | ternary .Values.global.enableDNSNameResolver false | quote }}
        - name: OVN_IPRESERVATION_ENABLE
          value: "true"
        - name: OVN_ALLOW_ICMP_NETPOL
          value: {{ hasKey .Values.global "allowICMPNetworkPolicy" | ternary .Values.global.allowICMPNetworkPolicy false | quote }}
        # Metrics server comes up late in ovnkube-cluster-manager startup, so
        # /metrics responding is a reasonable readiness signal.
        readinessProbe:
          httpGet:
            path: /metrics
            port: 9411
            scheme: HTTPS
          initialDelaySeconds: 30
          timeoutSeconds: 5
          periodSeconds: 30
      # end of container
      volumes:
      - name: host-var-log-ovs
        hostPath:
          path: /var/log/openvswitch
      - name: host-var-log-ovnkube
        hostPath:
          path: /var/log/ovn-kubernetes
      - name: host-var-run-ovs
        hostPath:
          path: /var/run/openvswitch
      - name: ovnkube-config
        configMap:
          name: ovnkube-config
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 6 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  labels:
    k8s-app: ovnkube-control-plane
  namespace: {{ .Values.global.namespace }}
  name: ovnkube-control-plane-prometheus-discovery
spec:
  selector:
    name: ovnkube-control-plane
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
  - name: metrics
    port: 9411
    protocol: TCP
    targetPort: 9411
