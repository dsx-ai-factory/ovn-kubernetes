---
apiVersion: v1
kind: Service
metadata:
  labels:
    k8s-app: ovnkube-node
  namespace: {{ .Values.global.namespace }}
  name: ovnkube-node-prometheus-discovery
spec:
  selector:
    metrics: ovnkube-node
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: ovnkube-node-metrics
      port: 9410
      protocol: TCP
      targetPort: 9410

---

# ovnkube-node
# daemonset version 3
# starts node daemons for single node zone ovn stack, each in a separate container
kind: DaemonSet
apiVersion: apps/v1
metadata:
  name: ovnkube-node
  # namespace set up by install
  namespace: {{ .Values.global.namespace }}
  annotations:
    kubernetes.io/description: |
      This DaemonSet launches the ovn-kubernetes networking components for worker nodes.
spec:
  selector:
    matchLabels:
      app: ovnkube-node
  minReadySeconds: 90
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        app: ovnkube-node
        name: ovnkube-node
        component: network
        type: infra
        kubernetes.io/os: "linux"
        ovn-db-pod: "true"
        metrics: ovnkube-node
      {{- $podAnnotations := deepCopy (.Values.podAnnotations | default dict) }}
      {{- with .Values.global.forceRestartNodeReason }}
        {{- $_ := set $podAnnotations "nais.nvidia.com/nodeRestartedFor" . }}
      {{- end }}
      {{- with $podAnnotations }}
      annotations:
        {{- range $key, $value := . }}
        {{ $key | quote }}: {{ $value | quote }}
        {{- end }}
      {{- end }}
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: ovn-node
      automountServiceAccountToken: true
      hostNetwork: true
      dnsPolicy: Default
      priorityClassName: "system-node-critical"

      containers:
      # nb-ovsdb - v3
      - name: nb-ovsdb
        image: {{ include "ovn-kubernetes.generateContainerImageString" (dict "image" .Values.ovnkubeSingleNodeZoneNbdb.image "Values" $.Values) }}
        imagePullPolicy: "IfNotPresent"
        command: ["/root/ovnkube.sh", "local-nb-ovsdb"]
        securityContext:
          runAsUser: 0
          capabilities:
            add: ["NET_ADMIN"]
        terminationMessagePolicy: FallbackToLogsOnError
        volumeMounts:
        # ovn db is stored in the pod in /etc/openvswitch
        # (or in /etc/ovn if OVN from new repository is used)
        # and on the host in /var/lib/openvswitch/
        - mountPath: /etc/openvswitch/
          name: host-var-lib-ovs
        - mountPath: /etc/ovn/
          name: host-var-lib-ovs
        - mountPath: /var/log/openvswitch/
          name: host-var-log-ovs
        - mountPath: /var/log/ovn/
          name: host-var-log-ovs
        - mountPath: /var/run/ovn/
          name: host-var-run-ovs
        - mountPath: /var/run/openvswitch/
          name: host-var-run-ovs
        - mountPath: /run/ovnkube-config
          name: ovnkube-config
          readOnly: true

        resources:
          {{- toYaml .Values.ovnkubeSingleNodeZoneNbdb.resources | nindent 10 }}
        env:
        - name: OVN_DAEMONSET_VERSION
          value: "1.4.0"
        - name: OVN_LOGLEVEL_NB
          value: {{ .Values.ovnkubeSingleNodeZoneNbdb.logging.level | quote }}
        - name: OVN_NORTHD_PROBE_INTERVAL
          value: "50000"
        - name: K8S_APISERVER
          valueFrom:
            configMapKeyRef:
              name: ovn-config
              key: k8s_apiserver
        - name: OVN_KUBERNETES_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: K8S_NODE_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: OVN_NORTHD_BACKOFF_INTERVAL
          value: "0"
        - name: ENABLE_IPSEC
          value: "false"
        - name: K8S_NODE
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        readinessProbe:
          exec:
            command: ["/usr/bin/ovn-kube-util", "readiness-probe", "-t", "ovnnb-db"]
          initialDelaySeconds: 30
          timeoutSeconds: 30
          periodSeconds: 60
      # end of container

      # sb-ovsdb - v3
      - name: sb-ovsdb
        image: {{ include "ovn-kubernetes.generateContainerImageString" (dict "image" .Values.ovnkubeSingleNodeZoneSbdb.image "Values" $.Values) }}
        imagePullPolicy: "IfNotPresent"
        command: ["/root/ovnkube.sh", "local-sb-ovsdb"]
        securityContext:
          runAsUser: 0
          capabilities:
            add: ["NET_ADMIN"]
        terminationMessagePolicy: FallbackToLogsOnError
        volumeMounts:
        # ovn db is stored in the pod in /etc/openvswitch
        # (or in /etc/ovn if OVN from new repository is used)
        # and on the host in /var/lib/openvswitch/
        - mountPath: /etc/openvswitch/
          name: host-var-lib-ovs
        - mountPath: /etc/ovn/
          name: host-var-lib-ovs
        - mountPath: /var/log/openvswitch/
          name: host-var-log-ovs
        - mountPath: /var/log/ovn/
          name: host-var-log-ovs
        - mountPath: /var/run/ovn/
          name: host-var-run-ovs
        - mountPath: /var/run/openvswitch/
          name: host-var-run-ovs
        - mountPath: /run/ovnkube-config
          name: ovnkube-config
          readOnly: true

        resources:
          {{- toYaml .Values.ovnkubeSingleNodeZoneSbdb.resources | nindent 10 }}
        env:
        - name: OVN_DAEMONSET_VERSION
          value: "1.4.0"
        - name: OVN_LOGLEVEL_SB
          value: {{ .Values.ovnkubeSingleNodeZoneSbdb.logging.level | quote }}
        - name: K8S_APISERVER
          valueFrom:
            configMapKeyRef:
              name: ovn-config
              key: k8s_apiserver
        - name: OVN_KUBERNETES_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: K8S_NODE_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: K8S_NODE
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName

        readinessProbe:
          exec:
            command: ["/usr/bin/ovn-kube-util", "readiness-probe", "-t", "ovnsb-db"]
          initialDelaySeconds: 30
          timeoutSeconds: 30
          periodSeconds: 60
      # end of container

      # ovn-northd - v3
      - name: ovn-northd
        image: {{ include "ovn-kubernetes.generateContainerImageString" (dict "image" .Values.ovnkubeSingleNodeZoneNorthd.image "Values" $.Values) }}
        imagePullPolicy: "IfNotPresent"
        command: ["/root/ovnkube.sh", "run-ovn-northd"]
        resources:
          {{- toYaml .Values.ovnkubeSingleNodeZoneNorthd.resources | nindent 10 }}
        securityContext:
          runAsUser: 0
          capabilities:
            add: ["SYS_NICE"]
        terminationMessagePolicy: FallbackToLogsOnError
        volumeMounts:
        # Run directories where we need to be able to access sockets
        - mountPath: /var/log/openvswitch/
          name: host-var-log-ovs
        - mountPath: /var/log/ovn/
          name: host-var-log-ovs
        - mountPath: /var/run/openvswitch/
          name: host-var-run-ovs
        - mountPath: /var/run/ovn/
          name: host-var-run-ovs
        - mountPath: /run/ovnkube-config
          name: ovnkube-config
          readOnly: true
        env:
        - name: OVN_DAEMONSET_VERSION
          value: "1.4.0"
        - name: OVN_LOGLEVEL_NORTHD
          value: {{ .Values.ovnkubeSingleNodeZoneNorthd.logging.level | quote }}
        - name: K8S_APISERVER
          valueFrom:
            configMapKeyRef:
              name: ovn-config
              key: k8s_apiserver
        - name: OVN_KUBERNETES_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        readinessProbe:
          exec:
            command: ["/usr/bin/ovn-kube-util", "readiness-probe", "-t", "ovn-northd"]
          initialDelaySeconds: 30
          timeoutSeconds: 30
          periodSeconds: 60
      # end of container

      - name: ovnkube-controller
        image: {{ include "ovn-kubernetes.generateContainerImageString" (dict "image" .Values.ovnkubeSingleNodeZone.image "Values" $.Values) }}
        imagePullPolicy: "IfNotPresent"
        {{- if eq (hasKey .Values.global "dummyGatewayBridge" | ternary .Values.global.dummyGatewayBridge false) true }}
        command:
        - /bin/bash
        - -c
        - |
          until ovs-vsctl --timeout=15 --may-exist add-br br-ex; do sleep 1; done
          ip address replace 10.44.0.1/32 dev br-ex
          ip link set br-ex up
          exec /root/ovnkube.sh ovnkube-controller-with-node
        {{- else }}
        command: ["/root/ovnkube.sh", "ovnkube-controller-with-node"]
        {{- end }}
        {{- $resources := deepCopy (.Values.ovnkubeSingleNodeZone.resources | default dict) }}
        {{- if and (.Values.global.enableNetworkSegmentation) (.Values.mgmtPortVFResourceName) (.Values.mgmtPortVFsCount) }}
        {{- /*
        Kubernetes rejects a request for an extended resource unless an equal limit is
        set, so the management port VFs go into both maps.
        */}}
        {{- $mgmtPortVFs := dict .Values.mgmtPortVFResourceName .Values.mgmtPortVFsCount }}
        {{- $_ := set $resources "requests" (mergeOverwrite ($resources.requests | default dict) $mgmtPortVFs) }}
        {{- $_ := set $resources "limits" (mergeOverwrite ($resources.limits | default dict) $mgmtPortVFs) }}
        {{- end }}
        resources:
          {{- toYaml $resources | nindent 10 }}
        securityContext:
          runAsUser: 0
          privileged: true
        terminationMessagePolicy: FallbackToLogsOnError
        volumeMounts:
        - mountPath: /var/log/ovn-kubernetes/
          name: host-var-log-ovnkube
        - mountPath: /var/run/openvswitch/
          name: host-var-run-ovs
        - mountPath: /var/run/ovn/
          name: host-var-run-ovs

        # We mount our socket here
        - mountPath: /var/run/ovn-kubernetes
          name: host-var-run-ovn-kubernetes
        {{- if and .Values.global.kata (eq .Values.global.kata.enableDAN true) }}
        # mount kata container DAN config dir
        - mountPath: /var/run/ovn-kubernetes/dans
          name: host-kata-dan-config-dir
        {{- end }}
        # CNI related mounts which we take over
        - mountPath: /opt/cni/bin
          name: host-opt-cni-bin
        - mountPath: /etc/cni/net.d
          name: host-etc-cni-netd
        # DHCP IPAM delegates to the dhcp CNI plugin, which talks to its
        # daemon over /run/cni/dhcp.sock
        - mountPath: /run/cni
          name: host-run-cni
        {{- if not .Values.global.noSystemd }}
        # Mount systemd/private to the ovnkube containers.
        # It allows listening for systemd events to track kubelet restart
        - mountPath: /run/systemd/private
          name: run-systemd
          subPath: private
          readOnly: true
        {{- end }}
        # for ovs-db metrics
        - mountPath: /etc/openvswitch/
          name: host-etc-openvswitch
          readOnly: true
        # /etc/openvswitch/conf.db may symlink to /var/lib/openvswitch/conf.db
        - mountPath: /var/lib/openvswitch
          name: host-var-lib-ovs
          readOnly: true
        # for ovn-db metrics
        - mountPath: /etc/ovn/
          name: host-var-lib-ovs
          readOnly: true
        - mountPath: /var/run/netns
          name: host-netns
          mountPropagation: Bidirectional
        {{- if .Values.global.enableOvnKubeIdentity }}
        - mountPath: /host-kubernetes
          name: host-etc-kubernetes
          readOnly: true
        {{- end }}
        {{- if or .Values.global.enableNetworkSegmentation .Values.global.enableOvnKubeIdentity }}
        - mountPath: /var/lib/kubelet
          name: host-var-lib-kubelet
          readOnly: true
        {{- end }}
        {{- if .Values.global.enableNetworkSegmentation }}
        - mountPath: /var/run/k8s.cni.cncf.io/devinfo/dp
          name: host-devinfo-dp
          readOnly: true
        {{- end }}
        - mountPath: /run/ovnkube-config
          name: ovnkube-config
          readOnly: true

        env:
        {{- if .Values.global.enableCoredumps }}
        - name: GOTRACEBACK
          value: "crash"
        {{- end }}
        - name: OVN_EGRESSSERVICE_ENABLE
          value: {{ hasKey .Values.global "enableEgressService" | ternary .Values.global.enableEgressService false | quote }}
        - name: OVN_DAEMONSET_VERSION
          value: "1.4.0"
        - name: OVNKUBE_LOGLEVEL
          value: {{ .Values.ovnkubeSingleNodeZone.logging.level | quote }}

        - name: OVNKUBE_LOGFILE_MAXSIZE
          value: "100"
        - name: OVNKUBE_LOGFILE_MAXBACKUPS
          value: "20"
        - name: OVNKUBE_LOGFILE_MAXAGE
          value: "20"
        - name: OVNKUBE_LIBOVSDB_CLIENT_LOGFILE
          value: {{ default "" .Values.global.libovsdbClientLogFile | quote }}
        - name: OVNKUBE_CONFIG_DURATION_ENABLE
          value: {{ default "" .Values.global.enableConfigDuration | quote }}
        - name: OVNKUBE_METRICS_SCALE_ENABLE
          value: {{ default "" .Values.global.enableMetricsScale | quote }}
        {{- if and .Values.global.metricsNodePprofPort (ne (toString .Values.global.metricsNodePprofPort) "0") }}
        - name: OVN_METRICS_NODE_PPROF_PORT
          value: {{ .Values.global.metricsNodePprofPort | quote }}
        {{- end }}
        - name: OVS_ENABLE_NATIVE_METRICS
          value: "true"
        - name: OVN_NET_CIDR
          valueFrom:
            configMapKeyRef:
              name: ovn-config
              key: net_cidr
        - name: OVN_SVC_CIDR
          valueFrom:
            configMapKeyRef:
              name: ovn-config
              key: svc_cidr
        - name: K8S_APISERVER
          valueFrom:
            configMapKeyRef:
              name: ovn-config
              key: k8s_apiserver
        - name: OVN_MTU
          valueFrom:
            configMapKeyRef:
              name: ovn-config
              key: mtu
        - name: OVN_ROUTABLE_MTU
          valueFrom:
            configMapKeyRef:
              name: ovn-config
              key: routable_mtu
              optional: true
        - name: K8S_NODE
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: K8S_NODE_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        {{- if .Values.global.metricsIp }}
        - name: METRICS_IP
          value: {{ .Values.global.metricsIp | quote }}
        {{- end }}
        - name: OVN_KUBERNETES_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace

        - name: OVN_GATEWAY_MODE
          value: "shared"
        {{- $gwOptions := include "ovn-kubernetes.getGatewayOptions" (dict "Values" $.Values "gatewayOptionsVal" .Values.global.gatewayOptions) }}
        {{- with $gwOptions }}
        - name: OVN_GATEWAY_OPTS
          value: {{ . | quote }}
        {{- end }}
        - name: OVN_HYBRID_OVERLAY_ENABLE
          value: {{ hasKey .Values.global "enableHybridOverlay" | ternary .Values.global.enableHybridOverlay false | quote }}

        - name: OVN_HYBRID_OVERLAY_NET_CIDR
          value: ""
        - name: OVN_ADMIN_NETWORK_POLICY_ENABLE
          value: {{ hasKey .Values.global "enableAdminNetworkPolicy" | ternary .Values.global.enableAdminNetworkPolicy false | quote }}
        - name: OVN_EGRESSIP_ENABLE
          value: {{ hasKey .Values.global "enableEgressIp" | ternary .Values.global.enableEgressIp false | quote }}
        - name: OVN_EGRESSIP_HEALTHCHECK_PORT
          value: {{ default "0" .Values.global.egressIpHealthCheckPort | quote }}
        - name: OVN_CTINV_FLOWS_DISABLE
          value: "true"
        - name: OVN_DISABLE_SNAT_MULTIPLE_GWS
          value: ""
        - name: OVN_DISABLE_FORWARDING
          value: "false"
        - name: OVN_DISABLE_PKT_MTU_CHECK
          value: "true"
        - name: OVN_STATELESS_NETPOL_ENABLE
          value: "true"
        - name: OVN_EGRESSFIREWALL_ENABLE
          value: {{ hasKey .Values.global "enableEgressFirewall" | ternary .Values.global.enableEgressFirewall true | quote }}
        - name: OVN_EGRESSQOS_ENABLE
          value: {{ hasKey .Values.global "enableEgressQos" | ternary .Values.global.enableEgressQos false | quote }}
        - name: OVN_ENCAP_PORT
          value: {{ default 6081 .Values.global.encapPort | quote }}

        - name: OVN_NETFLOW_TARGETS
          value: ""
        - name: OVN_SFLOW_TARGETS
          value: ""
        - name: OVN_IPFIX_TARGETS
          value: ""
        - name: OVN_IPFIX_SAMPLING
          value: {{ default "" .Values.global.ipfixSampling | quote }}
        - name: OVN_IPFIX_CACHE_MAX_FLOWS
          value: {{ default "" .Values.global.ipfixCacheMaxFlows | quote }}
        - name: OVN_IPFIX_CACHE_ACTIVE_TIMEOUT
          value: {{ default "" .Values.global.ipfixCacheActiveTimeout | quote }}
          
        - name: OVN_V4_JOIN_SUBNET
          value: {{ default "" .Values.global.v4JoinSubnet | quote }}
        - name: OVN_V6_JOIN_SUBNET
          value: {{ default "" .Values.global.v6JoinSubnet | quote }}
        - name: OVN_V4_MASQUERADE_SUBNET
          value: {{ default "" .Values.global.v4MasqueradeSubnet | quote }}
        - name: OVN_V6_MASQUERADE_SUBNET
          value: {{ default "" .Values.global.v6MasqueradeSubnet | quote }}

        - name: OVN_MULTICAST_ENABLE
          value: {{ hasKey .Values.global "enableMulticast" | ternary .Values.global.enableMulticast false | quote }}
        - name: OVN_EX_GW_NETWORK_INTERFACE
          value: ""
        - name: OVN_SSL_ENABLE
          value: "no"
        - name: OVN_REMOTE_PROBE_INTERVAL
          value: "100000"
        - name: OVN_MONITOR_ALL
          value: "true"
        - name: OVN_OFCTRL_WAIT_BEFORE_CLEAR
          value: "10000"
        - name: OVN_ENABLE_LFLOW_CACHE
          value: {{ hasKey .Values.global "enableLFlowCache" | ternary .Values.global.enableLFlowCache false | quote }}
        - name: OVN_LFLOW_CACHE_LIMIT
          value: {{ default "" .Values.global.lFlowCacheLimit | quote }}
        - name: OVN_LFLOW_CACHE_LIMIT_KB
          value: {{ default "" .Values.global.lFlowCacheLimitKb | quote }}
        - name: OVN_MULTI_NETWORK_ENABLE
          value: "true"
        - name: OVN_NETWORK_QOS_ENABLE
          value: {{ default "false" .Values.global.enableNetworkQos | quote }}
        {{- with .Values.nodeMgmtPortNetdev }}
        - name: OVNKUBE_NODE_MGMT_PORT_NETDEV
          value: {{ . | quote }}
        {{- end }}
        - name: OVN_EMPTY_LB_EVENTS
          value: {{ default "" .Values.global.emptyLbEvents | quote }}
        - name: OVN_ACL_LOGGING_RATE_LIMIT
          value: {{ default 20 .Values.global.aclLoggingRateLimit | quote }}
        - name: OVN_ADMIN_PBR_ENABLE
          value: {{ hasKey .Values.global "enableAdminPbr" | ternary .Values.global.enableAdminPbr true | quote }}
        - name: OVN_IPRESERVATION_ENABLE
          value: "true"
        - name: OVN_OBSERV_ENABLE
          value: "false"
        - name: OVN_HOST_NETWORK_NAMESPACE
          valueFrom:
            configMapKeyRef:
              name: ovn-config
              key: host_network_namespace
        - name: OVN_NETWORK_SEGMENTATION_ENABLE
          value: {{ hasKey .Values.global "enableNetworkSegmentation" | ternary .Values.global.enableNetworkSegmentation false | quote }}
        - name: OVN_NETWORK_CONNECT_ENABLE
          value: {{ default "false" .Values.global.enableNetworkConnect | quote }}
        - name: OVNKUBE_NODE_MGMT_PORT_DP_RESOURCE_NAME
          value: {{ default "" .Values.mgmtPortVFResourceName | quote }}
        - name: OVN_ROUTE_ADVERTISEMENTS_ENABLE
          value: {{ default "false" .Values.global.enableRouteAdvertisements | quote }}
        - name: OVN_UPLINK_ENABLE
          value: {{ default "false" .Values.global.enableUplink | quote }}
        - name: OVN_EVPN_ENABLE
          value: {{ default "false" .Values.global.enableEVPN | quote }}
        - name: OVN_ADVERTISED_UDN_ISOLATION_MODE
          value: {{ default "strict" .Values.global.advertisedUDNIsolationMode | quote }}
        - name: OVN_NO_OVERLAY_ENABLE
          value: {{ default "false" .Values.global.enableNoOverlay | quote }}
        - name: OVN_ENABLE_MULTI_EXTERNAL_GATEWAY
          value: {{ hasKey .Values.global "enableMultiExternalGateway" | ternary .Values.global.enableMultiExternalGateway false | quote }}
        - name: OVN_ENABLE_OVNKUBE_IDENTITY
          value: {{ hasKey .Values.global "enableOvnKubeIdentity" | ternary .Values.global.enableOvnKubeIdentity false | quote }}
        - name: OVN_ENABLE_SVC_TEMPLATE_SUPPORT
          value: {{ hasKey .Values.global "enableSvcTemplate" | ternary .Values.global.enableSvcTemplate false | quote }}
        - name: OVN_ENABLE_DNSNAMERESOLVER
          value: {{ hasKey .Values.global "enableDNSNameResolver" | ternary .Values.global.enableDNSNameResolver false | quote }}
        - name: OVN_ALLOW_ICMP_NETPOL
          value: {{ hasKey .Values.global "allowICMPNetworkPolicy" | ternary .Values.global.allowICMPNetworkPolicy false | quote }}
        # required by Layer-2 Networks and cannot be disabled
        - name: OVN_DISABLE_REQUESTEDCHASSIS
          value: "false"
        - name: OVN_UDN_ALLOWED_DEFAULT_SERVICES
          value: {{ hasKey .Values.global "udnAllowedDefaultServices" | ternary .Values.global.udnAllowedDefaultServices "" | quote }}
        {{- if and .Values.global.kata (eq .Values.global.kata.enableDAN true) }}
        - name: OVNKUBE_ENABLE_KATA_DAN
          value: "true"
        {{- end }}
        - name: OVS_DB_TRANSACTION_TIMEOUT
          value: {{ hasKey .Values.global "ovsdbTxnTimeout" | ternary .Values.global.ovsdbTxnTimeout "10" | quote }}
        - name: OVNKUBE_ISTIO_AMBIENT_ENABLE
          value: "true"
        - name: OVN_PRE_CONF_UDN_ADDR_ENABLE
          value: {{ default "false" .Values.global.enablePreconfiguredUDNAddresses | quote }}
        - name: OVN_DYNAMIC_UDN_ALLOCATION
          value: {{ default "false" .Values.global.enableDynamicUDNAllocation | quote }}
        - name: OVN_DYNAMIC_UDN_GRACE_PERIOD
          value: {{ default "" .Values.global.dynamicUDNGracePeriod | quote }}
        - name: OVNKUBE_POD_HOST_PORT_ENABLE
          value: {{ .Values.global.enablePodHostPort | default false | quote }}
        - name: OVNKUBE_SKIP_CTMARK_HOSTPORTS
          value: {{ default "" .Values.global.skipCTMarkHostPorts | quote }}
        - name: OVN_ENCAP_TOS
          value: "inherit"
        - name: OVS_MAX_REVALIDATOR
          value: "5000"
        - name: OVS_MIN_REVALIDATE_PPS
          value: "0"
        - name: OVS_MAX_IDLE
          value: "20000"
        {{- with include "ovn-kubernetes.getClusterDefaultNad" . }}
        - name: OVNKUBE_CLUSTER_DEFAULT_NAD
          value: {{ . }}
        {{- end }}
        - name: COREDNS_CLUSTER_IP
          value: {{ include "ovn-kubernetes.corednsClusterIP" (dict "Values" $.Values) }}
        # ovnkube-node-liveness-check.sh checks
        # - 10-ovn-kubernetes.conf is present
        # - ovn-cni-server.sock is serving cni requests
        livenessProbe:
          exec:
            command:
            - /bin/bash
            - /root/ovnkube-node-liveness-check.sh
          failureThreshold: 3
          initialDelaySeconds: 30
          periodSeconds: 30
          successThreshold: 1
          timeoutSeconds: 5  
        # ovnkube-node-readiness-check.sh checks
        # - whether the metrics server is running since it is one of the last things we do,
        # - also checks if we can access KUBERNETES_SERVICE_HOST:KUBERNETES_SERVICE_PORT
        # - also checks if we can access coredns service
        readinessProbe:
          exec:
            command:
            - /bin/bash
            - /root/ovnkube-node-readiness-check.sh
          initialDelaySeconds: 30
          timeoutSeconds: 5
          periodSeconds: 30

      # end of container

      - name: ovn-controller
        image: {{ include "ovn-kubernetes.generateContainerImageString" (dict "image" .Values.ovnkubeSingleNodeZoneOvnHost.image "Values" $.Values) }}
        imagePullPolicy: "IfNotPresent"
        command: ["/root/ovnkube.sh", "ovn-controller"]
        resources:
          {{- toYaml .Values.ovnkubeSingleNodeZoneOvnHost.resources | nindent 10 }}
        securityContext:
          runAsUser: 0
          capabilities:
            add: ["SYS_NICE"]
        terminationMessagePolicy: FallbackToLogsOnError
        volumeMounts:
        - mountPath: /var/log/openvswitch/
          name: host-var-log-ovs
        - mountPath: /var/log/ovn/
          name: host-var-log-ovs
        - mountPath: /var/run/openvswitch/
          name: host-var-run-ovs
        - mountPath: /var/run/ovn/
          name: host-var-run-ovs
        - mountPath: /run/ovnkube-config
          name: ovnkube-config
          readOnly: true
        env:
        - name: OVN_DAEMONSET_VERSION
          value: "1.4.0"
        - name: OVN_LOGLEVEL_CONTROLLER
          value: {{ .Values.ovnkubeSingleNodeZoneOvnHost.logging.level | quote }}
        - name: K8S_APISERVER
          valueFrom:
            configMapKeyRef:
              name: ovn-config
              key: k8s_apiserver
        - name: OVN_KUBERNETES_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        readinessProbe:
          exec:
            command: ["/usr/bin/ovn-kube-util", "readiness-probe", "-t", "ovn-controller"]
          initialDelaySeconds: 30
          timeoutSeconds: 30
          periodSeconds: 60
      # end of container

      volumes:
      # Common volumes
      - name: host-var-log-ovs
        hostPath:
          path: /var/log/openvswitch
      - name: host-var-log-ovnkube
        hostPath:
          path: /var/log/ovn-kubernetes
      - name: host-var-run-ovs
        hostPath:
          path: /var/run/openvswitch
      - name: host-etc-openvswitch
        hostPath:
          path: /etc/openvswitch
      - name: host-var-run-ovn-kubernetes
        hostPath:
          path: /var/run/ovn-kubernetes
      {{- if and .Values.global.kata (eq .Values.global.kata.enableDAN true) }}
      - name: host-kata-dan-config-dir
        hostPath:
          path: {{ .Values.global.kata.danConfigDir | default "/run/kata-containers/dans" }}
          type: DirectoryOrCreate
      {{- end }}
      - name: host-opt-cni-bin
        hostPath:
          path: /opt/cni/bin
      - name: host-etc-cni-netd
        hostPath:
          path: /etc/cni/net.d
      - name: host-run-cni
        hostPath:
          path: /run/cni
          type: DirectoryOrCreate
      - name: ovnkube-config
        configMap:
          name: ovnkube-config
      {{- if not .Values.global.noSystemd }}
      # Mount systemd/private to the ovnkube containers.
      # It allows listening for systemd events to track kubelet restart
      - name: run-systemd
        hostPath:
          path: /run/systemd
      {{- end }}
      # ovn-dbs
      - name: host-var-lib-ovs
        hostPath:
          path: /var/lib/openvswitch
      - name: host-netns
        hostPath:
          path: /var/run/netns
      {{- if .Values.global.enableOvnKubeIdentity }}
      - name: host-etc-kubernetes
        hostPath:
          path: /etc/kubernetes
      {{- end }}

      {{- if or .Values.global.enableNetworkSegmentation .Values.global.enableOvnKubeIdentity }}
      - name: host-var-lib-kubelet
        hostPath:
          path: /var/lib/kubelet
      {{- end }}

      {{- if .Values.global.enableNetworkSegmentation }}
      - name: host-devinfo-dp
        hostPath:
          path: /var/run/k8s.cni.cncf.io/devinfo/dp
      {{- end }}

      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 6 }}
      {{- end }}
