# Default values for ovnkube-single-node-zone.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

ovnkubeSingleNodeZone:
  logging:
    level: "5"

ovnkubeSingleNodeZoneNbdb:
  logging:
    level: "-vconsole:info -vfile:info"

ovnkubeSingleNodeZoneSbdb:
  logging:
    level: "-vconsole:info -vfile:info"

ovnkubeSingleNodeZoneNorthd:
  logging:
    level: "-vconsole:info -vfile:info"

ovnkubeSingleNodeZoneOvnHost:
  logging:
    level: "-vconsole:info"

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
      - matchExpressions:
        - key: k8s.ovn.org/dpu-host
          operator: DoesNotExist

# -- extra annotations for the ovnkube-node pod template.
podAnnotations: {}

disableFirewalld: true
adminFirewalldZone: admin

# To utilize hardware offloading for management ports, a netdevice or a deviceplugin resource name that
# specifies a pool of devices can be specified.
# mgmtPortVFResourceName will override nodeMgmtPortNetdev if both are specified

# The net device to be used for management ports
nodeMgmtPortNetdev: ""

# The device plugin resource name that identifies the allocated interfaces to be used for management ports
# This field must be set when using hardware offloading for primary UDNs.
mgmtPortVFResourceName: ""
# If using hardware offloading for primary UDNs,the number of VFs required to handle management ports,
# which depends on the number of primary UDNs required must also be specified.
# -- set the count of VFs required to handle management ports for UDN
mgmtPortVFsCount: 4

# -- prometheus monitoring related fields
monitoring:
  # -- specify the labels for serviceMonitors to be selected for target discovery.
  # Prometheus operator defines what namespaces and what servicemonitors within these
  # namespaces must be selected for target discovery. The fields defined below helps
  # in defining that.
  serviceMonitorSelectorLabels:
    k8s-app: ovnkube-node
    release: kube-prometheus-stack


# -- tolerations for the ovnkube-node pods.
tolerations:
- operator: "Exists"
