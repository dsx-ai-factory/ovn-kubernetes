{{- include "dashboard.validateValues" . -}}
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: sdn-ovn-k8s-ic-ovn-northd
  namespace: {{ .Values.namespace }}
  labels:
    app: grafana
spec:
  allowCrossNamespaceImport: {{ .Values.grafana.allowCrossNamespaceImport }}
  instanceSelector:
  {{- with .Values.grafana.instanceSelector }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
  folder: SDN
  datasources:
  - inputName: "DS_PROMETHEUS"
    datasourceName: {{ .Values.grafana.datasourceName }}
  json: |-
{{- tpl (.Files.Get "json/sdn-ovn-k8s-ic-ovn-northd.json") . | nindent 4 }}
