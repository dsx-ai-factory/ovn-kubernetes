# grafana settings

# the namespace to deploy the dashboards
namespace: monitoring

# grafana settings for Grafana Operator
grafana:
  # Mapping `DS_PROMETHEUS` to a datasource name in case of Grafana Operator,
  datasourceName: prometheus
  # allow importing dashboards into Grafana instances in other namespaces
  allowCrossNamespaceImport: false
  # the Grafana instance selector for provisioning dashboards
  instanceSelector:
    matchLabels:
      grafana.com/selector: grafana

# Prometheus label and PromQL series selector used by the cluster dashboard variable.
clusterLabel:
  label: cluster
  discoveryMetric: up{job="ovnkube-node"}

# Metrics used by the host OVS process CPU and memory panels.
processMetrics:
  # Supported values: process_exporter, otel_process_scraper.
  profile: otel_process_scraper
